<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 687" width="576" height="687">
  <style>
    /* Base Terminal Background & Window Styling */
    .bg { fill: #0D1117; }
    .window-header { fill: #161B22; stroke: #30363D; stroke-width: 1px; }
    .window-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px; fill: #8B949E; font-weight: 600; text-anchor: middle;
    }

    /* Core Line Animation & Monospace Typography */
    .line {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #00FF99;
      white-space: pre;
      opacity: 1;
      animation: boot-line 0.18s ease-in forwards;
    }

    /* Optional Terminal Boot Prompt Styling */
    .prompt { fill: #F8F8F2; font-weight: bold; }
    .sys-msg { fill: #8BE9FD; }

    /* Keyframes: Fade in and snap horizontally from slight offset */
    @keyframes boot-line {
      0% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
      }
    }
  </style>

