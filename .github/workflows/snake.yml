name: Generate Snake Contribution Grid

on:
  schedule: # Execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Update Snake Animation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: balajiprincejoshva-byte
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00FF99&color_dots=#0D1117,#161B22,#0E4429,#006D32,#26A641
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#00FF99

      - name: Deploy Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
